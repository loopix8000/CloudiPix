name: Android release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, such as v0.1.2
        type: string
        required: true

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  release:
    runs-on: ubuntu-24.04
    concurrency:
      group: release-${{ inputs.tag || github.ref_name }}
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check release tag format
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Expected a release tag such as v0.1.2.' >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: refs/tags/${{ inputs.tag || github.ref_name }}

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Locate Android build tools
        run: |
          compile_sdk=$(sed -n 's/^compileSdk = "\([0-9]*\)"$/\1/p' gradle/libs.versions.toml)
          build_tools=$(sed -n 's/^buildTools = "\([0-9.]*\)"$/\1/p' gradle/libs.versions.toml)
          sdk_root=${ANDROID_HOME:-/usr/local/lib/android/sdk}
          tools_dir="$sdk_root/build-tools/$build_tools"
          if [[ ! -f "$sdk_root/platforms/android-$compile_sdk/android.jar" || ! -x "$tools_dir/apksigner" ]]; then
            shopt -s nullglob
            sdk_managers=("$sdk_root"/cmdline-tools/*/bin/sdkmanager)
            "${sdk_managers[0]:?Android SDK manager unavailable}" --sdk_root="$sdk_root" \
              "platforms;android-$compile_sdk" "build-tools;$build_tools"
          fi
          printf 'ANDROID_HOME=%s\nANDROID_BUILD_TOOLS=%s\n' "$sdk_root" "$tools_dir" >> "$GITHUB_ENV"

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Sign and verify APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          : "${ANDROID_KEYSTORE_BASE64:?Missing ANDROID_KEYSTORE_BASE64}"
          : "${ANDROID_KEYSTORE_PASSWORD:?Missing ANDROID_KEYSTORE_PASSWORD}"
          : "${ANDROID_KEY_ALIAS:?Missing ANDROID_KEY_ALIAS}"
          : "${ANDROID_KEY_PASSWORD:?Missing ANDROID_KEY_PASSWORD}"
          apk_dir=app/build/outputs/apk/release
          metadata="$apk_dir/output-metadata.json"
          jq -e --arg version "${RELEASE_TAG#v}" '
            .applicationId == "app.cloudipix.gallery.official" and
            (.elements | length == 1) and .elements[0].versionName == $version
          ' "$metadata" >/dev/null || { echo 'APK metadata does not match the release tag.' >&2; exit 1; }
          unsigned_apk="$apk_dir/$(jq -er '.elements[0].outputFile' "$metadata")"

          umask 077
          keystore=$(mktemp "$RUNNER_TEMP/cloudipix-release.XXXXXX")
          trap 'rm -f -- "$keystore"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          "$ANDROID_BUILD_TOOLS/zipalign" -P 16 -f 4 "$unsigned_apk" "$RUNNER_TEMP/aligned.apk"
          "$ANDROID_BUILD_TOOLS/apksigner" sign \
            --ks "$keystore" --ks-type PKCS12 --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEY_PASSWORD \
            --out "$RUNNER_TEMP/CloudiPix.apk" "$RUNNER_TEMP/aligned.apk"

          verification=$("$ANDROID_BUILD_TOOLS/apksigner" verify --print-certs "$RUNNER_TEMP/CloudiPix.apk")
          if ! grep -Fxq 'Signer #1 certificate SHA-256 digest: 5df178d6f36123fa9c52b0020b8f2e1ba64d9506316689b32d5ab9819a0bc28d' <<< "$verification"; then
            echo 'The APK was not signed with the CloudiPix release key.' >&2
            exit 1
          fi

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" "$RUNNER_TEMP/CloudiPix.apk" \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes \
            --title "CloudiPix ${RELEASE_TAG#v}"
